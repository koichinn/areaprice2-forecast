<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JEPX 予測精度</title><style>
:root{--bg:#f4f7fb;--card:#fff;--text:#18243a;--muted:#66758a;--blue:#2468d4;--line:#dfe6ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","Yu Gothic UI",sans-serif}header{padding:20px 28px;background:#10213a;color:#fff;display:flex;justify-content:space-between;gap:16px;align-items:center}h1{margin:2px 0;font-size:24px}.sub{font-size:13px;color:#cbd7e8}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select,input{padding:8px 11px;border-radius:8px;border:1px solid #c7d2e2;background:#fff;font-weight:700}button.on{background:var(--blue);color:#fff}main{max-width:1500px;margin:auto;padding:20px}.status{color:var(--muted);margin-bottom:12px}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.card{background:#fff;padding:14px;border-radius:12px;box-shadow:0 2px 10px #1f355b12}.kpi span{display:block;font-size:12px;color:var(--muted)}.kpi strong{font-size:21px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.wide{grid-column:1/-1}canvas{width:100%;height:380px}.card h2:after{content:"  （円/kWh）";font-size:11px;color:#66758a;font-weight:400}.tablewrap{overflow:auto;max-height:480px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:7px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}th{position:sticky;top:0;background:#edf2f8}th:nth-child(-n+5),td:nth-child(-n+5){text-align:left}@media(max-width:1000px){header{flex-direction:column;align-items:flex-start}.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body>
<header><div><div class="sub">JEPX FORECAST ACCURACY</div><h1>予測・実績 比較ダッシュボード</h1><div class="sub">対象日ごとに最新の計算日を採用／実績のみでも表示</div></div><div class="controls"><label>最終日 <input id="endDate" type="date"></label><button data-days="1">1日</button><button data-days="7" class="on">7日</button><button data-days="30">1か月</button><select id="area"></select><select id="day"><option value="all">全DAY</option></select><button onclick="location.reload()">最新データに更新</button></div></header>
<main><div id="status" class="status"></div><div id="runs" class="card"></div><div id="kpis" class="kpis" style="margin-top:12px"></div><section class="grid"><article class="card wide"><h2>予測・実績</h2><canvas id="mainChart"></canvas></article><article class="card"><h2>日別 MAE</h2><canvas id="maeChart"></canvas></article><article class="card"><h2>日別 Bias</h2><canvas id="biasChart"></canvas></article><article class="card wide"><h2>比較詳細</h2><div class="tablewrap"><table><thead><tr><th>対象日時</th><th>エリア</th><th>DAY</th><th>採用計算日</th><th>予測計算日時</th><th>予測</th><th>実績</th><th>誤差</th><th>絶対誤差</th></tr></thead><tbody id="body"></tbody></table></div></article></section></main><script>const P=__PAYLOAD__,D=P.records,$=s=>document.querySelector(s);let days=7;const areas=[...new Map(D.map(x=>[x.area,x.area_ja||x.area])).entries()];area.innerHTML=areas.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');if(areas.some(x=>x[0]=='system'))area.value='system';day.innerHTML+=[1,2,3,4,5,6,7].map(x=>`<option>${x}</option>`).join('');const dates=[...new Set(D.map(x=>x.target_date))].sort();endDate.min=dates[0]||'';endDate.max=P.marketConfirmedThrough;endDate.value=P.marketConfirmedThrough;
function ok(x){return typeof x==='number'&&isFinite(x)}function f(x,d=2){return ok(x)?x.toLocaleString('ja-JP',{maximumFractionDigits:d}):'-'}function rows(){let e=new Date(endDate.value+'T00:00:00'),s=new Date(e);s.setDate(s.getDate()-days+1);return D.filter(x=>x.area==area.value&&(day.value=='all'||x.day==+day.value)&&new Date(x.target_date)>=s&&new Date(x.target_date)<=e).sort((a,b)=>(a.target_datetime||a.target_date).localeCompare(b.target_datetime||b.target_date)||((a.slot||0)-(b.slot||0)))}function met(a){let z=a.filter(x=>ok(x.predicted_price_yen_kwh)&&ok(x.actual_price_yen_kwh)),e=z.map(x=>x.predicted_price_yen_kwh-x.actual_price_yen_kwh);if(!e.length)return{};return{n:e.length,mae:e.reduce((s,v)=>s+Math.abs(v),0)/e.length,rmse:Math.sqrt(e.reduce((s,v)=>s+v*v,0)/e.length),bias:e.reduce((s,v)=>s+v,0)/e.length,mape:z.reduce((s,x)=>s+(x.actual_price_yen_kwh?Math.abs((x.predicted_price_yen_kwh-x.actual_price_yen_kwh)/x.actual_price_yen_kwh):0),0)/e.length*100}}
function draw(id,series){let cv=$('#'+id),w=cv.clientWidth||800,h=cv.clientHeight||340,z=devicePixelRatio||1;cv.width=w*z;cv.height=h*z;let c=cv.getContext('2d');c.scale(z,z);let vs=series.flatMap(s=>s.v).filter(ok);c.clearRect(0,0,w,h);if(!vs.length){c.fillStyle='#66758a';c.fillText('表示対象データなし',20,30);return}let mn=Math.min(...vs),mx=Math.max(...vs),pad=(mx-mn||1)*.08,p={l:64,r:18,t:22,b:50};mn-=pad;mx+=pad;let X=i=>p.l+i*(w-p.l-p.r)/Math.max(1,series[0].v.length-1),Y=v=>p.t+(mx-v)*(h-p.t-p.b)/(mx-mn);c.font='11px Segoe UI';c.fillStyle='#64748b';c.strokeStyle='#dfe6ef';c.lineWidth=1;for(let j=0;j<=5;j++){let y=p.t+j*(h-p.t-p.b)/5,v=mx-j*(mx-mn)/5;c.beginPath();c.moveTo(p.l,y);c.lineTo(w-p.r,y);c.stroke();c.fillText(v.toFixed(2),6,y+4)}let n=series[0].v.length,step=Math.max(1,Math.ceil(n/8));for(let i=0;i<n;i+=step){let x=X(i);c.beginPath();c.moveTo(x,p.t);c.lineTo(x,h-p.b);c.stroke();let rr=window.__chartRows&&window.__chartRows[i],lab=rr?(rr.target_datetime||rr.target_date||'').slice(5,16):String(i);c.save();c.translate(x,h-10);c.rotate(-.35);c.fillText(lab,0,0);c.restore()}if(mn<0&&mx>0){c.strokeStyle='#94a3b8';c.setLineDash([5,4]);c.beginPath();c.moveTo(p.l,Y(0));c.lineTo(w-p.r,Y(0));c.stroke();c.setLineDash([])}series.forEach(s=>{c.strokeStyle=s.c;c.lineWidth=s.name==='実績'?3:2;c.beginPath();let pen=false;s.v.forEach((v,i)=>{if(ok(v)){let x=X(i),y=Y(v);pen?c.lineTo(x,y):c.moveTo(x,y);pen=true}else pen=false});c.stroke()})}
function render(){let r=rows(),m=met(r);window.__chartRows=r;status.textContent=`市場確定日: ${P.marketConfirmedThrough} | 選択最終日: ${endDate.value} | 期間: ${days}日 | 表示: ${r.length}コマ | 精度比較: ${m.n||0}コマ`;let by={};r.forEach(x=>{if(x.target_date&&!by[x.target_date])by[x.target_date]=x.selected_calc_date||'実績のみ'});runs.innerHTML='<b>対象日ごとの採用計算日</b>'+Object.entries(by).sort().map(x=>`<div>${x[0]} → ${x[1]}</div>`).join('');kpis.innerHTML=[['MAE',f(m.mae)],['RMSE',f(m.rmse)],['Bias',f(m.bias)],['MAPE',ok(m.mape)?f(m.mape)+'%':'-'],['比較コマ',f(m.n,0)],['実績のみ',f(r.filter(x=>!ok(x.predicted_price_yen_kwh)&&ok(x.actual_price_yen_kwh)).length,0)]].map(x=>`<div class="card kpi"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('');draw('mainChart',[{v:r.map(x=>x.predicted_price_yen_kwh),c:'#2468d4'},{v:r.map(x=>x.actual_price_yen_kwh),c:'#111827'}]);let g={};r.forEach(x=>(g[x.target_date]??=[]).push(x));let dm=Object.values(g).map(met);draw('maeChart',[{v:dm.map(x=>x.mae),c:'#d34a44'}]);draw('biasChart',[{v:dm.map(x=>x.bias),c:'#2468d4'}]);body.innerHTML=r.slice().reverse().map(x=>`<tr><td>${x.target_datetime||x.target_date+' #'+x.slot}</td><td>${x.area_ja||x.area}</td><td>${x.day??'-'}</td><td>${x.selected_calc_date||'実績のみ'}</td><td>${x.forecast_created_at||'-'}</td><td>${f(x.predicted_price_yen_kwh)}</td><td>${f(x.actual_price_yen_kwh)}</td><td>${f(x.error)}</td><td>${f(x.abs_error)}</td></tr>`).join('')}
endDate.onchange=area.onchange=day.onchange=render;document.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-days]').forEach(x=>x.classList.remove('on'));b.classList.add('on');days=+b.dataset.days;render()});onresize=render;render();</script></body></html>

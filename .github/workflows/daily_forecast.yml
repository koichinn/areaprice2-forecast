name: "JEPX Daily Forecast (AreaPrice2)"

on:
  schedule:
    # 毎朝 08:45 JST (前日 23:45 UTC) に1回自動実行 (00:00 UTC の混雑を回避し 09:00 頃に完了)
    - cron: '45 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-forecast:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Set up Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: "Install Python dependencies"
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow scikit-learn lightgbm requests urllib3 jpholiday openpyxl truststore

      - name: "Map virtual P drive and restore data bundle from Release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $pRoot = Join-Path $env:RUNNER_TEMP "p_drive"
          New-Item -ItemType Directory -Force -Path $pRoot | Out-Null
          subst P: $pRoot
          Get-PSDrive P

          gh release download latest-data --repo "${{ github.repository }}" --pattern "cloud_release_bundle.zip" --clobber
          if (!(Test-Path "cloud_release_bundle.zip")) {
            throw "cloud_release_bundle.zip not found in release latest-data"
          }

          python -c "
          import shutil, zipfile
          from pathlib import Path
          dest = Path('P:/\u30a8\u30ea\u30a2\u30d7\u30e9\u30a4\u30b92')
          dest.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile('cloud_release_bundle.zip', 'r') as zf:
              for m in zf.infolist():
                  if m.filename.startswith('.github/'):
                      continue
                  zf.extract(m, dest)
          repo_root = Path('.')
          for sub in ['\u5b66\u7fd2', 'web', 'database', '\u4e88\u6e2c', '\u4ed5\u69d8']:
              sdir = repo_root / sub
              if not sdir.exists():
                  continue
              for f in sdir.rglob('*'):
                  if f.is_file() and f.suffix.lower() in {'.py', '.ps1', '.json', '.yml', '.yaml', '.md', '.txt'}:
                      target = dest / f.relative_to(repo_root)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(f, target)
                      print('Overlayed from repo:', f.relative_to(repo_root))
          for ps1 in dest.rglob('*.ps1'):
              raw = ps1.read_bytes()
              if not raw.startswith(b'\xef\xbb\xbf'):
                  ps1.write_bytes(b'\xef\xbb\xbf' + raw)
          print('Extracted files to:', dest)
          "
          Remove-Item "cloud_release_bundle.zip" -Force

      - name: "Set timezone to Asia/Tokyo (JST)"
        shell: pwsh
        run: |
          tzutil /s "Tokyo Standard Time"
          Get-Date

      - name: "Run daily forecast pipeline (run_daily_forecast_occto_v4.ps1)"
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $learnDir = "P:\$([char]0x30A8)$([char]0x30EA)$([char]0x30A2)$([char]0x30D7)$([char]0x30E9)$([char]0x30A4)$([char]0x30B9)2\$([char]0x5B66)$([char]0x7FD2)"
          Set-Location $learnDir
          $ps1Path = Join-Path $learnDir "run_daily_forecast_occto_v4.ps1"
          powershell -ExecutionPolicy Bypass -File $ps1Path -SkipFreshnessCheck -PastStopDays 30

      - name: "Send forecast results via Email for Power Automate sync (Optional)"
        if: always()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        shell: pwsh
        run: |
          if ($env:SMTP_USER -and $env:SMTP_PASS) {
            python -c "import runpy; runpy.run_path('P:/\u30a8\u30ea\u30a2\u30d7\u30e9\u30a4\u30b92/\u5b66\u7fd2/send_forecast_mail.py', run_name='__main__')"
          } else {
            Write-Host "SMTP secrets not configured; skipping email step."
          }

      - name: "Copy outputs to workspace and commit to repository"
        if: success()
        shell: pwsh
        run: |
          python -c "
          import json, re, shutil
          from pathlib import Path
          src = Path('P:/\u30a8\u30ea\u30a2\u30d7\u30e9\u30a4\u30b92')
          dst = Path('.')
          html_p = src / 'web' / 'forecast_accuracy_dashboard.html'
          if html_p.is_file() and html_p.stat().st_size > 20 * 1024 * 1024:
              txt = html_p.read_text(encoding='utf-8')
              m = re.search(r'const P=(\{.*\}),D=P\.records', txt)
              if m:
                  obj = json.loads(m.group(1))
                  ui_keys = {'target_date','target_datetime','slot','area','area_ja','day','selected_calc_date','selected_run','forecast_created_at','predicted_price_yen_kwh','actual_price_yen_kwh','error','abs_error'}
                  new_recs = []
                  for r in obj.get('records', []):
                      nr = {k: (round(v, 3) if isinstance(v, float) else v) for k, v in r.items() if k in ui_keys and v is not None and v != ''}
                      new_recs.append(nr)
                  obj['records'] = new_recs
                  new_json = json.dumps(obj, ensure_ascii=False, separators=(',', ':'))
                  txt = txt[:m.start(1)] + new_json + txt[m.end(1):]
                  html_p.write_text(txt, encoding='utf-8')
                  print(f'Compacted HTML to {html_p.stat().st_size / (1024*1024):.2f} MB')
          for sub, pat in [('\u4e88\u6e2c', 'forecast_system_day1_occto_latest.csv'),
                           ('\u4e88\u6e2c', 'forecast_area_day1_recon_latest.csv'),
                           ('\u4e88\u6e2c', 'forecast_tokyo_day1_v4_latest.csv'),
                           ('\u4e88\u6e2c', 'tokyo_day1_v4_pred_history.csv'),
                           ('\u4e88\u6e2c', 'forecast_day1_to_day7_latest.csv'),
                           ('\u4e88\u6e2c', 'system_day1_compare_daily.csv'),
                           ('web', '*.html'),
                           ('web', '*.csv')]:
              sdir = src / sub
              ddir = dst / sub
              ddir.mkdir(parents=True, exist_ok=True)
              for f in sdir.glob(pat):
                  if f.is_file():
                      shutil.copy2(f, ddir / f.name)
                      print('Copied:', ddir / f.name)
          "
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          $status = git status --porcelain
          if ($status) {
            $stamp = Get-Date -Format "yyyy-MM-dd HH:mm"
            git commit -m "Auto-update JEPX forecast ($stamp JST)"
            git pull --rebase origin main
            git push origin main
          } else {
            Write-Host "No changes to commit."
          }

      - name: "Upload forecast outputs as GitHub Artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jepx-forecast-outputs
          path: |
            予測/*.csv
            web/*.html
            web/*.csv
          retention-days: 30

      - name: "Persist updated master data back to GitHub Release (latest-data)"
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          python -c "import runpy; runpy.run_path('P:/\u30a8\u30ea\u30a2\u30d7\u30e9\u30a4\u30b92/\u5b66\u7fd2/build_cloud_package.py', run_name='__main__')"
          $zipPath = "P:\$([char]0x30A8)$([char]0x30EA)$([char]0x30A2)$([char]0x30D7)$([char]0x30E9)$([char]0x30A4)$([char]0x30B9)2\cloud_release_bundle.zip"
          if (Test-Path $zipPath) {
            gh release upload latest-data $zipPath --repo "${{ github.repository }}" --clobber
          }
